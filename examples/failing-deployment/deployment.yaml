apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: mcp-nginx-demo
  labels:
    app.kubernetes.io/name: nginx-demo
    app.kubernetes.io/managed-by: infra-gate-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.27-doesnotexist
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-demo
  namespace: mcp-nginx-demo
  labels:
    app.kubernetes.io/name: nginx-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nginx-demo
  ports:
    - port: 80
      targetPort: 80
