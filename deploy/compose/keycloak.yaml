services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-3010}:8080"
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  mcp-gateway:
    image: ${INFRA_GATE_GATEWAY_IMAGE:-kubernetes-mcp-guard-gateway}
    build:
      context: ../..
      dockerfile: deploy/docker/mcp-gateway.Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy
    env_file:
      - ${INFRA_GATE_GATEWAY_ENV_FILE:-../generated/development.env}
    volumes:
      - ${INFRA_GATE_KUBECONFIG_HOST_PATH}:/run/kube/mcp-nginx-demo.compose.config:ro
      - mcp-gateway-approvals:/data/approvals
      - mcp-gateway-guardrails:/data/guardrails
      - mcp-gateway-dataprotection-keys:/data/dataprotection-keys
    ports:
      - "${INFRA_GATE_BIND_ADDRESS:-127.0.0.1}:${INFRA_GATE_BIND_PORT:-3001}:3001"

volumes:
  mcp-gateway-approvals:
  mcp-gateway-guardrails:
  mcp-gateway-dataprotection-keys:
