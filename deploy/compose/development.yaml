# deploy/compose/development.yaml
# Local development deployment. Uses Keycloak OIDC.
#
# Run:
#   dotnet run --project src/InfraGate.RunProfiles -- generate development \
#     --set identityProvider.authority=http://127.0.0.1:3010/realms/infra-gate \
#     --set identityProvider.metadataAddress=http://172.17.0.1:3010/realms/infra-gate/.well-known/openid-configuration \
#     --set approvalAuthority.oauthTokenEndpoint=http://172.17.0.1:3010/realms/infra-gate/protocol/openid-connect/token \
#     --output deploy/generated/development.env
#   docker compose --env-file deploy/generated/development.env \
#     -f deploy/compose/development.yaml up

name: infra-gate-development

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: infra-gate
      POSTGRES_USER: infra-gate
      POSTGRES_PASSWORD: infra-gate-dev-password
      INFRA_GATE_RUN_APPROVAL_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../src/InfraGate.Approvals.Postgres/Migrations:/var/approval-migrations:ro
      - ../../scripts/persistence/run-compose-migrations.sh:/docker-entrypoint-initdb.d/00-run-approval-migrations.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra-gate -d infra-gate"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  mcp-gateway:
    image: ${INFRA_GATE_GATEWAY_IMAGE:-ghcr.io/mirusser/kubernetes-mcp-guard-gateway}:${TAG:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - ${INFRA_GATE_GATEWAY_ENV_FILE:-../generated/development.env}
    volumes:
      - ${INFRA_GATE_KUBECONFIG_HOST_PATH:-/etc/infra-gate/development.kubeconfig}:/run/kube/infra-gate.config:ro
      - ${INFRA_GATE_APPROVAL_HOST_PATH:-/var/lib/infra-gate/development/approvals}:/data/approvals
      - ${INFRA_GATE_GUARD_AUDIT_HOST_PATH:-/var/lib/infra-gate/development/guardrails}:/data/guardrails
      - ${INFRA_GATE_DATA_PROTECTION_HOST_PATH:-/var/lib/infra-gate/development/dataprotection-keys}:/data/dataprotection-keys
    ports:
      - "${INFRA_GATE_BIND_ADDRESS:-127.0.0.1}:${INFRA_GATE_BIND_PORT:-3001}:3001"
    read_only: true
    tmpfs:
      - /tmp:exec,size=256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pgdata:
