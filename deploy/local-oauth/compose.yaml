# deploy/local-oauth/compose.yaml
# Keycloak + MCP Gateway + local agent stack — local build.
# Keycloak is auto-configured from deploy/keycloak/infra-gate-realm.json.
#
# Prerequisites: ./scripts/create-demo-kubeconfig.sh --compose
#
# Run:
#   ./scripts/generate-env.sh local-compose
#   docker compose --env-file deploy/generated/local-compose.env \
#     -f deploy/local-oauth/compose.yaml up --build
#
# Docker Hub alternate for the gateway image: mirusser/kubernetes-mcp-guard-gateway
#
# Network topology (production-like separation):
#   keycloak    → compose-internal network only
#   mcp-gateway → compose-internal network (→ keycloak) + minikube network (→ K8s API)
# The minikube Docker network must exist before starting: `minikube start --driver=docker`

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-3010}:8080"
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: infra-gate
      POSTGRES_USER: infra-gate
      POSTGRES_PASSWORD: infra-gate-dev-password
      INFRA_GATE_RUN_APPROVAL_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../src/InfraGate.Approvals.Postgres/Migrations:/var/approval-migrations:ro
      - ../../scripts/persistence/run-compose-migrations.sh:/docker-entrypoint-initdb.d/00-run-approval-migrations.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra-gate -d infra-gate"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  mcp-gateway:
    image: ${INFRA_GATE_GATEWAY_IMAGE:-kubernetes-mcp-guard-gateway}
    hostname: gateway
    build:
      context: ../..
      dockerfile: deploy/docker/mcp-gateway.Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file:
      # Compose --env-file supplies interpolation values; env_file passes the
      # same generated profile into the gateway container runtime.
      - ${INFRA_GATE_GATEWAY_ENV_FILE:-../generated/local-compose.env}
    environment:
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      INFRA_GATE_OAUTH_AUTHORITY: ${INFRA_GATE_OAUTH_AUTHORITY}
      INFRA_GATE_OAUTH_METADATA_ADDRESS: ${INFRA_GATE_OAUTH_METADATA_ADDRESS}
      INFRA_GATE_OAUTH_RESOURCE: ${INFRA_GATE_OAUTH_RESOURCE}
      INFRA_GATE_OAUTH_SCOPE: ${INFRA_GATE_OAUTH_SCOPE}
      INFRA_GATE_OAUTH_REQUIRE_HTTPS_METADATA: ${INFRA_GATE_OAUTH_REQUIRE_HTTPS_METADATA}
      INFRA_GATE_APPROVAL_OAUTH_CLIENT_ID: ${INFRA_GATE_APPROVAL_OAUTH_CLIENT_ID}
      INFRA_GATE_APPROVAL_OAUTH_CALLBACK_PATH: ${INFRA_GATE_APPROVAL_OAUTH_CALLBACK_PATH}
      INFRA_GATE_APPROVAL_OAUTH_AUTHORIZATION_ENDPOINT: ${INFRA_GATE_APPROVAL_OAUTH_AUTHORIZATION_ENDPOINT}
      INFRA_GATE_APPROVAL_OAUTH_TOKEN_ENDPOINT: ${INFRA_GATE_APPROVAL_OAUTH_TOKEN_ENDPOINT}
      INFRA_GATE_APPROVAL_BASE_URL: ${INFRA_GATE_APPROVAL_BASE_URL}
      INFRA_GATE_OPERATOR_GROUP: ${INFRA_GATE_OPERATOR_GROUP:-kubernetes-operators}
      INFRA_GATE_OPERATOR_EMAIL: ${INFRA_GATE_OPERATOR_EMAIL:-operators@example.local}
      INFRA_GATE_GATEWAY_SMTP_HOST: ${INFRA_GATE_GATEWAY_SMTP_HOST:-mailpit}
      INFRA_GATE_GATEWAY_SMTP_PORT: ${INFRA_GATE_GATEWAY_SMTP_PORT:-1025}
      INFRA_GATE_GATEWAY_SMTP_FROM: ${INFRA_GATE_GATEWAY_SMTP_FROM:-infragate@example.local}
      INFRA_GATE_GATEWAY_SMTP_ENABLE_SSL: ${INFRA_GATE_GATEWAY_SMTP_ENABLE_SSL:-false}
      INFRA_GATE_DOWNSTREAM_ASSEMBLY: ${INFRA_GATE_DOWNSTREAM_ASSEMBLY}
      INFRA_GATE_GUARD_AUDIT_ROOT: ${INFRA_GATE_GUARD_AUDIT_ROOT}
      INFRA_GATE_DOWNSTREAM_AUTH_REQUIRED: ${INFRA_GATE_DOWNSTREAM_AUTH_REQUIRED}
      INFRA_GATE_DOWNSTREAM_AUTH_AUTHORITY: ${INFRA_GATE_DOWNSTREAM_AUTH_AUTHORITY}
      INFRA_GATE_DOWNSTREAM_AUTH_METADATA_ADDRESS: ${INFRA_GATE_DOWNSTREAM_AUTH_METADATA_ADDRESS}
      INFRA_GATE_DOWNSTREAM_AUTH_REQUIRE_HTTPS_METADATA: ${INFRA_GATE_DOWNSTREAM_AUTH_REQUIRE_HTTPS_METADATA}
      INFRA_GATE_DOWNSTREAM_AUTH_AUDIENCE: ${INFRA_GATE_DOWNSTREAM_AUTH_AUDIENCE}
      INFRA_GATE_DOWNSTREAM_AUTH_SCOPE: ${INFRA_GATE_DOWNSTREAM_AUTH_SCOPE}
      INFRA_GATE_DOWNSTREAM_AUTH_GATEWAY_CLIENT_ID: ${INFRA_GATE_DOWNSTREAM_AUTH_GATEWAY_CLIENT_ID}
      INFRA_GATE_DOWNSTREAM_AUTH_GATEWAY_CLIENT_SECRET: ${INFRA_GATE_DOWNSTREAM_AUTH_GATEWAY_CLIENT_SECRET}
      KUBECONFIG: ${KUBECONFIG}
      K8S_MCP_APPROVAL_ROOT: ${K8S_MCP_APPROVAL_ROOT}
      K8S_MCP_ALLOWED_NAMESPACES: ${K8S_MCP_ALLOWED_NAMESPACES}
      K8S_MCP_LOG_PATH: /data/logs/mcp-server.log
    volumes:
      - ${INFRA_GATE_CONFIG_HOST_PATH}:/app/config/appsettings.InfraGate.json:ro
      - ${INFRA_GATE_KUBECONFIG_HOST_PATH}:/run/kube/mcp-nginx-demo.compose.config:ro
      - ${INFRA_GATE_APPROVAL_HOST_PATH}:/data/approvals
      - ${INFRA_GATE_GUARD_AUDIT_HOST_PATH}:/data/guardrails
      - ../../.mcp-logs:/data/logs
      - ${INFRA_GATE_DATA_PROTECTION_HOST_PATH}:/data/dataprotection-keys
    ports:
      - "${INFRA_GATE_BIND_ADDRESS:-127.0.0.1}:${INFRA_GATE_BIND_PORT:-3001}:3001"
    networks:
      - default
      - k8s

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "${MAILPIT_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - default

  observer:
    image: ${INFRA_GATE_OBSERVER_IMAGE:-infragate-observer}
    build:
      context: ../..
      dockerfile: src/InfraGate.Observer/Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy
      mcp-gateway:
        condition: service_started
    environment:
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_URLS: ${INFRA_GATE_OBSERVER_ASPNETCORE_URLS:-http://0.0.0.0:3003}
      INFRA_GATE_OBSERVER_GATEWAY_BASE_URL: ${INFRA_GATE_OBSERVER_GATEWAY_BASE_URL:-http://gateway:3001/mcp}
      INFRA_GATE_OBSERVER_OAUTH_AUTHORITY: ${INFRA_GATE_OBSERVER_OAUTH_AUTHORITY:-http://keycloak:8080/realms/infra-gate}
      INFRA_GATE_OBSERVER_CLIENT_ID: ${INFRA_GATE_OBSERVER_CLIENT_ID:-infra-gate-observer}
      INFRA_GATE_OBSERVER_CLIENT_SECRET: ${INFRA_GATE_OBSERVER_CLIENT_SECRET:-observer-secret}
      INFRA_GATE_OBSERVER_OAUTH_SCOPE: ${INFRA_GATE_OBSERVER_OAUTH_SCOPE:-mcp:tools.readonly}
      INFRA_GATE_OBSERVER_LLM_PROVIDER: ${INFRA_GATE_OBSERVER_LLM_PROVIDER}
      INFRA_GATE_OBSERVER_LLM_MODEL: ${INFRA_GATE_OBSERVER_LLM_MODEL}
      INFRA_GATE_OBSERVER_LLM_API_KEY: ${INFRA_GATE_OBSERVER_LLM_API_KEY}
      INFRA_GATE_OBSERVER_CYCLE_INTERVAL_SECONDS: ${INFRA_GATE_OBSERVER_CYCLE_INTERVAL_SECONDS:-60}
      INFRA_GATE_OBSERVER_WALL_CLOCK_CAP_SECONDS: ${INFRA_GATE_OBSERVER_WALL_CLOCK_CAP_SECONDS:-120}
      INFRA_GATE_OBSERVER_MAX_TOOL_ITERATIONS: ${INFRA_GATE_OBSERVER_MAX_TOOL_ITERATIONS:-8}
      INFRA_GATE_OBSERVER_FILE_SINK_ROOT: ${INFRA_GATE_OBSERVER_FILE_SINK_ROOT:-/data/observer/findings}
      INFRA_GATE_OBSERVER_PLANNER_HANDOFF_URL: ${INFRA_GATE_OBSERVER_PLANNER_HANDOFF_URL:-http://planner:3004/a2a/planner}
      INFRA_GATE_OBSERVER_AUDIT_CONNECTION_STRING: ${INFRA_GATE_OBSERVER_AUDIT_CONNECTION_STRING}
      INFRA_GATE_OBSERVER_ALLOWED_NAMESPACES: ${INFRA_GATE_OBSERVER_ALLOWED_NAMESPACES:-mcp-nginx-demo}
      INFRA_GATE_OAUTH_AUTHORITY: ${INFRA_GATE_OAUTH_AUTHORITY:-http://keycloak:8080/realms/infra-gate}
      INFRA_GATE_OAUTH_REQUIRE_HTTPS_METADATA: ${INFRA_GATE_OAUTH_REQUIRE_HTTPS_METADATA:-false}
    volumes:
      - ${INFRA_GATE_OBSERVER_HOST_PATH:-./.mcp-observer/findings}:/data/observer/findings
    ports:
      - "${INFRA_GATE_OBSERVER_BIND_ADDRESS:-127.0.0.1}:${INFRA_GATE_OBSERVER_BIND_PORT:-3003}:3003"
    networks:
      - default

  planner:
    image: ${INFRA_GATE_PLANNER_IMAGE:-infragate-planner}
    build:
      context: ../..
      dockerfile: src/InfraGate.Planner/Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy
      mcp-gateway:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_URLS: ${INFRA_GATE_PLANNER_ASPNETCORE_URLS:-http://0.0.0.0:3004}
      INFRA_GATE_PLANNER_GATEWAY_BASE_URL: ${INFRA_GATE_PLANNER_GATEWAY_BASE_URL:-http://gateway:3001/mcp}
      INFRA_GATE_PLANNER_EXECUTOR_HANDOFF_URL: ${INFRA_GATE_PLANNER_EXECUTOR_HANDOFF_URL:-http://executor:3005/handoff/proposals}
      INFRA_GATE_PLANNER_TOKEN_ENDPOINT: ${INFRA_GATE_PLANNER_TOKEN_ENDPOINT:-http://keycloak:8080/realms/infra-gate/protocol/openid-connect/token}
      INFRA_GATE_PLANNER_CLIENT_ID: ${INFRA_GATE_PLANNER_CLIENT_ID:-infra-gate-planner}
      INFRA_GATE_PLANNER_CLIENT_SECRET: ${INFRA_GATE_PLANNER_CLIENT_SECRET:-planner-secret}
      INFRA_GATE_PLANNER_OAUTH_AUTHORITY: ${INFRA_GATE_PLANNER_OAUTH_AUTHORITY:-http://keycloak:8080/realms/infra-gate}
      INFRA_GATE_PLANNER_OAUTH_SCOPE: ${INFRA_GATE_PLANNER_OAUTH_SCOPE:-mcp:tools.propose mcp:tools.readonly}
      INFRA_GATE_PLANNER_LLM_PROVIDER: ${INFRA_GATE_PLANNER_LLM_PROVIDER}
      INFRA_GATE_PLANNER_LLM_MODEL: ${INFRA_GATE_PLANNER_LLM_MODEL}
      INFRA_GATE_PLANNER_LLM_API_KEY: ${INFRA_GATE_PLANNER_LLM_API_KEY}
      INFRA_GATE_PLANNER_ANOMALY_WALL_CLOCK_CAP_SECONDS: ${INFRA_GATE_PLANNER_ANOMALY_WALL_CLOCK_CAP_SECONDS:-30}
      INFRA_GATE_PLANNER_BATCH_WALL_CLOCK_CAP_SECONDS: ${INFRA_GATE_PLANNER_BATCH_WALL_CLOCK_CAP_SECONDS:-300}
      INFRA_GATE_PLANNER_MAX_TOOL_ITERATIONS: ${INFRA_GATE_PLANNER_MAX_TOOL_ITERATIONS:-4}
      INFRA_GATE_PLANNER_FILE_SINK_ROOT: ${INFRA_GATE_PLANNER_FILE_SINK_ROOT:-/data/planner/proposals}
    volumes:
      - ${INFRA_GATE_PLANNER_HOST_PATH:-./.mcp-remediation/proposals}:/data/planner/proposals
    ports:
      - "${INFRA_GATE_PLANNER_BIND_ADDRESS:-127.0.0.1}:${INFRA_GATE_PLANNER_BIND_PORT:-3004}:3004"
    networks:
      - default

  executor:
    image: ${INFRA_GATE_EXECUTOR_IMAGE:-infragate-executor}
    build:
      context: ../..
      dockerfile: src/InfraGate.Executor/Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy
      planner:
        condition: service_started
    environment:
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_URLS: ${INFRA_GATE_EXECUTOR_ASPNETCORE_URLS:-http://0.0.0.0:3005}
      INFRA_GATE_EXECUTOR_GATEWAY_BASE_URL: ${INFRA_GATE_EXECUTOR_GATEWAY_BASE_URL:-http://gateway:3001/mcp}
      INFRA_GATE_EXECUTOR_TOKEN_ENDPOINT: ${INFRA_GATE_EXECUTOR_TOKEN_ENDPOINT:-http://keycloak:8080/realms/infra-gate/protocol/openid-connect/token}
      INFRA_GATE_EXECUTOR_CLIENT_ID: ${INFRA_GATE_EXECUTOR_CLIENT_ID:-infra-gate-executor}
      INFRA_GATE_EXECUTOR_CLIENT_SECRET: ${INFRA_GATE_EXECUTOR_CLIENT_SECRET:-executor-secret}
      INFRA_GATE_EXECUTOR_OAUTH_AUTHORITY: ${INFRA_GATE_EXECUTOR_OAUTH_AUTHORITY:-http://keycloak:8080/realms/infra-gate}
      INFRA_GATE_EXECUTOR_OAUTH_SCOPE: ${INFRA_GATE_EXECUTOR_OAUTH_SCOPE:-mcp:tools.execute}
      INFRA_GATE_EXECUTOR_CONCURRENCY_CAP: ${INFRA_GATE_EXECUTOR_CONCURRENCY_CAP:-64}
      INFRA_GATE_EXECUTOR_WATCH_TIMEOUT_SECONDS: ${INFRA_GATE_EXECUTOR_WATCH_TIMEOUT_SECONDS:-900}
    ports:
      - "${INFRA_GATE_EXECUTOR_BIND_ADDRESS:-127.0.0.1}:${INFRA_GATE_EXECUTOR_BIND_PORT:-3005}:3005"
    networks:
      - default

volumes:
  pgdata:

networks:
  default: {}
  k8s:
    external: true
    name: minikube
