# deploy/local-oauth/compose.yaml
# Keycloak + MCP Gateway + local agent stack — local build.
# Keycloak is auto-configured from deploy/keycloak/infra-gate-realm.json.
#
# Prerequisites: ./scripts/create-demo-kubeconfig.sh --compose
#
# Run:
#   ./scripts/generate-env.sh local-compose
#   docker compose --env-file deploy/generated/local-compose.env \
#     -f deploy/local-oauth/compose.yaml up --build
#
# Docker Hub alternate for the gateway image: mirusser/kubernetes-mcp-guard-gateway
#
# Network topology (production-like separation):
#   keycloak    → compose-internal network only
#   mcp-gateway → compose-internal network (→ keycloak) + minikube network (→ K8s API)
# The minikube Docker network must exist before starting: `minikube start --driver=docker`

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-3010}:8080"
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: infra-gate
      POSTGRES_USER: infra-gate
      POSTGRES_PASSWORD: infra-gate-dev-password
      INFRA_GATE_RUN_APPROVAL_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../src/InfraGate.Approvals.Postgres/Migrations:/var/approval-migrations:ro
      - ../../scripts/persistence/run-compose-migrations.sh:/docker-entrypoint-initdb.d/00-run-approval-migrations.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra-gate -d infra-gate"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  mcp-gateway:
    image: ${INFRA_GATE_GATEWAY_IMAGE:-kubernetes-mcp-guard-gateway}
    hostname: gateway
    build:
      context: ../..
      dockerfile: deploy/docker/mcp-gateway.Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file:
      # Compose --env-file supplies interpolation values; env_file passes the
      # same generated profile into the gateway container runtime.
      - ${INFRA_GATE_GATEWAY_ENV_FILE:-../generated/local-compose.env}
    volumes:
      - ${INFRA_GATE_KUBECONFIG_HOST_PATH}:/run/kube/mcp-nginx-demo.compose.config:ro
      - ${INFRA_GATE_APPROVAL_HOST_PATH}:/data/approvals
      - ${INFRA_GATE_GUARD_AUDIT_HOST_PATH}:/data/guardrails
      - ../../.mcp-logs:/data/logs
      - ${INFRA_GATE_DATA_PROTECTION_HOST_PATH}:/data/dataprotection-keys
    ports:
      - "${INFRA_GATE_BIND_ADDRESS:-127.0.0.1}:${INFRA_GATE_BIND_PORT:-3001}:3001"
    networks:
      - default
      - k8s

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "${MAILPIT_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - default

  observer:
    image: ${INFRA_GATE_OBSERVER_IMAGE:-infragate-observer}
    build:
      context: ../..
      dockerfile: src/InfraGate.Observer/Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy
      mcp-gateway:
        condition: service_started
    env_file:
      - ${INFRA_GATE_GATEWAY_ENV_FILE:-../generated/local-compose.env}
    volumes:
      - ${INFRA_GATE_OBSERVER_HOST_PATH:-./.mcp-observer/findings}:/data/observer/findings
    ports:
      - "${INFRA_GATE_OBSERVER_BIND_ADDRESS:-127.0.0.1}:${INFRA_GATE_OBSERVER_BIND_PORT:-3003}:3003"
    networks:
      - default

  planner:
    image: ${INFRA_GATE_PLANNER_IMAGE:-infragate-planner}
    build:
      context: ../..
      dockerfile: src/InfraGate.Planner/Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy
      mcp-gateway:
        condition: service_started
      mailpit:
        condition: service_started
    env_file:
      - ${INFRA_GATE_GATEWAY_ENV_FILE:-../generated/local-compose.env}
    volumes:
      - ${INFRA_GATE_PLANNER_HOST_PATH:-./.mcp-remediation/proposals}:/data/planner/proposals
    ports:
      - "${INFRA_GATE_PLANNER_BIND_ADDRESS:-127.0.0.1}:${INFRA_GATE_PLANNER_BIND_PORT:-3004}:3004"
    networks:
      - default

  executor:
    image: ${INFRA_GATE_EXECUTOR_IMAGE:-infragate-executor}
    build:
      context: ../..
      dockerfile: src/InfraGate.Executor/Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy
      planner:
        condition: service_started
    env_file:
      - ${INFRA_GATE_GATEWAY_ENV_FILE:-../generated/local-compose.env}
    ports:
      - "${INFRA_GATE_EXECUTOR_BIND_ADDRESS:-127.0.0.1}:${INFRA_GATE_EXECUTOR_BIND_PORT:-3005}:3005"
    networks:
      - default

volumes:
  pgdata:

networks:
  default: {}
  k8s:
    external: true
    name: minikube
