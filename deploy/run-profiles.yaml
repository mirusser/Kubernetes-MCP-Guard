      oauthAuthorizationEndpoint: http://127.0.0.1:3010/realms/infra-gate/protocol/openid-connect/auth
      oauthTokenEndpoint: http://127.0.0.1:3010/realms/infra-gate/protocol/openid-connect/token
    genericApprovalCore:
      approvalRoot: .mcp-approvals
    downstreamAuth:
      required: "false"
    domainAdapters:
      - name: kubernetesAdapter
        type: kubernetes
        kubernetes:
          kubeconfig: .kube/mcp-nginx-demo.config
          allowedNamespaces:
