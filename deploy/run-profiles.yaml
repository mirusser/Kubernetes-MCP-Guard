      allowedNamespaces:
        - mcp-nginx-demo
    planner:
      aspnetcoreUrls: http://0.0.0.0:3004
      gatewayBaseUrl: http://127.0.0.1:3001/mcp
      executorHandoffUrl: http://127.0.0.1:3005/a2a/executor
      clientId: infra-gate-planner
      clientSecret: planner-secret
      oauthAuthority: http://127.0.0.1:3010/realms/infra-gate
      scope: mcp:tools.propose mcp:tools.readonly
      llmProvider: openrouter
      llmModel: openrouter/free
      anomalyWallClockCapSeconds: "90"
      maxToolIterations: "6"
      fileSinkRoot: .mcp-planner/proposals
    executor:
      aspnetcoreUrls: http://0.0.0.0:3005
      gatewayBaseUrl: http://127.0.0.1:3001/mcp
      clientId: infra-gate-executor
      clientSecret: executor-secret
      oauthAuthority: http://127.0.0.1:3010/realms/infra-gate
      scope: mcp:tools.execute

  local-stdio:
    kind: mcp-stdio
    runtimeMode: Development
    genericApprovalCore:
