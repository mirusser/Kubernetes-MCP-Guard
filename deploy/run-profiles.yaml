version: 1

defaults:
  gateway:
    aspnetcoreUrls: http://0.0.0.0:3001
    downstreamAssembly: /app/server/InfraGate.McpServer.dll
    guardAuditRoot: /data/guardrails
  identityProvider:
    scope: mcp:tools
    requireHttpsMetadata: "false"
  approvalAuthority:
    oauthClientId: infra-gate-approval-ui
    oauthCallbackPath: /approvals/oauth/callback

profiles:
  local-compose:
    kind: compose
    runtimeMode: Development
    gateway: {}
    identityProvider:
      realmImport: deploy/keycloak/infra-gate-realm.json
      authority: http://127.0.0.1:3010/realms/infra-gate
      metadataAddress: http://keycloak:8080/realms/infra-gate/.well-known/openid-configuration
      resource: http://127.0.0.1:3001/mcp
    approvalAuthority:
      baseUrl: http://127.0.0.1:3001
      oauthAuthorizationEndpoint: http://127.0.0.1:3010/realms/infra-gate/protocol/openid-connect/auth
      oauthTokenEndpoint: http://keycloak:8080/realms/infra-gate/protocol/openid-connect/token
    genericApprovalCore:
      approvalRoot: /data/approvals
      postgresConnectionString: "Host=postgres;Port=5432;Database=infra-gate;Username=infra-gate;Password=infra-gate-dev-password"
      runMigrationsOnStartup: "true"
    downstreamAuth:
      required: "true"
      authority: http://keycloak:8080/realms/infra-gate
      metadataAddress: http://keycloak:8080/realms/infra-gate/.well-known/openid-configuration
      requireHttpsMetadata: "false"
      audience: urn:infra-gate:mcp-server
      scope: mcp:downstream
      gatewayClientId: infra-gate-gateway-service
      gatewayClientSecret: gateway-service-secret
    host:
      bindAddress: 127.0.0.1
      bindPort: "3001"
      gatewayImage: kubernetes-mcp-guard-gateway
      kubeconfigHostPath: ../../.kube/mcp-nginx-demo.compose.config
      approvalHostPath: ../../.mcp-approvals
      guardAuditHostPath: ../../.mcp-guardrails
      dataProtectionHostPath: ../../.mcp-dataprotection-keys
    domainAdapters:
      - name: kubernetesAdapter
        type: kubernetes
        kubernetes:
          kubeconfig: /run/kube/mcp-nginx-demo.compose.config
          allowedNamespaces:
            - mcp-nginx-demo
    observer:
      aspnetcoreUrls: http://0.0.0.0:3003
      gatewayBaseUrl: http://gateway:3001/mcp
      oauthAuthority: http://keycloak:8080/realms/infra-gate
      clientId: infra-gate-observer
      clientSecret: observer-secret
      scope: mcp:tools.readonly
      llmProvider: openrouter
      llmModel: openrouter/free
      cycleCadenceSeconds: "60"
      cycleWallClockCapSeconds: "120"
      maxToolIterations: "8"
      fileSinkRoot: /data/observer/findings
      plannerHandoffUrl: http://planner:3004/a2a/planner
      auditConnectionString: "Host=postgres;Port=5432;Database=infra-gate;Username=infra-gate;Password=infra-gate-dev-password"
      observerHostPath: ../../.mcp-observer/findings
      allowedNamespaces:
        - mcp-nginx-demo
    planner:
      aspnetcoreUrls: http://0.0.0.0:3004
      gatewayBaseUrl: http://gateway:3001/mcp
      executorHandoffUrl: http://executor:3005/a2a/executor
      clientId: infra-gate-planner
      clientSecret: planner-secret
      oauthAuthority: http://keycloak:8080/realms/infra-gate
      scope: mcp:tools.propose mcp:tools.readonly
      llmProvider: openrouter
      llmModel: openrouter/free
      anomalyWallClockCapSeconds: "90"
      maxToolIterations: "6"
      fileSinkRoot: /data/planner/proposals
      plannerHostPath: ../../.mcp-remediation/proposals
    executor:
      aspnetcoreUrls: http://0.0.0.0:3005
      gatewayBaseUrl: http://gateway:3001/mcp
      clientId: infra-gate-executor
      clientSecret: executor-secret
      oauthAuthority: http://keycloak:8080/realms/infra-gate
      scope: mcp:tools.execute

  local-source-gateway:
    kind: dotnet
    runtimeMode: Development
    gateway: {}
    identityProvider:
      realmImport: deploy/keycloak/infra-gate-realm.json
