version: 1

profiles:
  local-compose:
    kind: compose
    runtimeMode: Development
    genericApprovalCore:
      approvalRoot: /data/approvals
    domainAdapters:
      - name: kubernetesAdapter
        type: kubernetes
        kubernetes:
          kubeconfig: /run/kube/mcp-nginx-demo.compose.config
          allowedNamespaces:
            - mcp-nginx-demo

  local-source-gateway:
    kind: dotnet
    runtimeMode: Development
    genericApprovalCore:
      approvalRoot: .mcp-approvals
    domainAdapters:
