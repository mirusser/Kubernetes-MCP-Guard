name: Semgrep Scheduled Security Scan

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: semgrep-scheduled-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Semgrep Scan
        id: semgrep
        env:
          SEMGREP_RULES: p/auto p/secrets p/owasp-top-ten
        run: |
          python3 -m pip install semgrep==1.165.0
          semgrep ci --config p/auto --config p/secrets --config p/owasp-top-ten

      - name: Upload SARIF to GitHub Security
        id: upload-sarif
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@87557b9c84dde89fdd9b10e88954ac2f4248e463  # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep-full
