name: Integration Tests

# Automatic pull_request/push triggers are disabled for now: this job runs on a
# self-hosted runner and no runner is currently available, so it would just sit
# queued on every PR/push. Trigger manually via workflow_dispatch once a runner
# is back online, then restore the pull_request/push triggers below.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  integration-tests:
    runs-on:
      - self-hosted
      - linux

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InfraGate.slnx

      - name: Build
        run: dotnet build InfraGate.slnx --configuration Release --no-restore

      - name: Validate run profiles
        run: dotnet run --project src/InfraGate.RunProfiles -- validate

      - name: Ensure Minikube is running
        run: |
          minikube start --wait=apiserver,system_pods --wait-timeout=5m
          minikube update-context
          kubectl config use-context minikube
          kubectl --request-timeout=10s get --raw=/readyz
          kubectl wait --for=condition=Ready node --all --timeout=120s

      - name: Create demo kubeconfig
        run: ./scripts/create-demo-kubeconfig.sh

      - name: Run MCP server integration tests
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/mcp-nginx-demo.config
        run: INFRA_GATE_RUN_INTEGRATION=1 dotnet test tests/InfraGate.McpServer.Tests/InfraGate.McpServer.Tests.csproj --configuration Release --no-build

      - name: Run gateway integration tests
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/mcp-nginx-demo.config
        run: INFRA_GATE_RUN_GATEWAY_INTEGRATION=1 dotnet test tests/InfraGate.McpGateway.Tests/InfraGate.McpGateway.Tests.csproj --configuration Release --no-build --filter "Category!=Keycloak"
