name: Integration Tests

# This job runs on ubuntu-latest (GitHub-hosted), provisioning its own
# disposable minikube cluster and demo workload per run (see
# .agents/Plans/2026-08-14-migrate-integration-tests-ci-to-hosted-runner.md
# for the hosted-runner migration history). Confirmed green via two manual
# `workflow_dispatch` runs on 2026-08-23 before restoring the automatic
# pull_request/push triggers below.
on:
  pull_request:
    paths: &integration-paths
      - 'src/InfraGate.McpGateway/**'
      - 'src/InfraGate.RunProfiles/**'
      - 'tests/InfraGate.McpGateway.Tests/**'
      - 'tests/InfraGate.McpServer.Tests/**'
      - 'scripts/install-kubernetes-mcp-server.sh'
      - 'scripts/install-kubernetes-mcp-server.tests.sh'
      - 'scripts/kubernetes-mcp-server.manifest.json'
      - 'scripts/install-minikube.sh'
      - 'scripts/minikube.manifest.json'
      - 'scripts/create-demo-kubeconfig.sh'
      - 'deploy/minikube/rbac.yaml'
      - 'deploy/minikube/nginx-demo-workload.yaml'
      - 'deploy/docker/mcp-gateway.Dockerfile'
      - '.github/workflows/integration-tests.yml'
  push:
    branches: [main, dev]
    paths: *integration-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5
        with:
          dotnet-version: 10.0.x

      - name: Validate kubernetes-mcp-server installer
        run: ./scripts/install-kubernetes-mcp-server.tests.sh

      - name: Install kubernetes-mcp-server
        run: ./scripts/install-kubernetes-mcp-server.sh

      - name: Restore
        run: dotnet restore InfraGate.slnx

      - name: Build
        run: dotnet build InfraGate.slnx --configuration Release --no-restore

      - name: Validate run profiles
        run: dotnet run --project src/InfraGate.RunProfiles -- validate

      - name: Install minikube
        run: ./scripts/install-minikube.sh

      - name: Ensure Minikube is running
        run: |
          minikube start --driver=docker --wait=apiserver,system_pods --wait-timeout=5m
          minikube update-context
          kubectl config use-context minikube
          kubectl --request-timeout=10s get --raw=/readyz
          kubectl wait --for=condition=Ready node --all --timeout=120s

      - name: Apply demo RBAC and workload
        run: |
          kubectl apply --validate=false -f deploy/minikube/rbac.yaml
          kubectl apply -f deploy/minikube/nginx-demo-workload.yaml
          # kubectl wait on a pod label selector races the Deployment
          # controller: right after apply, no Pod object exists yet, so
          # `wait` sees zero matches and exits immediately with "no
          # matching resources found" instead of waiting. The Deployment
          # itself is created synchronously by apply, so wait on its
          # rollout status instead.
          kubectl rollout status deployment/nginx-demo -n mcp-nginx-demo --timeout=120s

      - name: Create demo kubeconfig
        run: ./scripts/create-demo-kubeconfig.sh

      - name: Run MCP server integration tests
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/mcp-nginx-demo.config
        run: >
          INFRA_GATE_RUN_INTEGRATION=1 dotnet test tests/InfraGate.McpServer.Tests/InfraGate.McpServer.Tests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=mcp-server-integration.trx"
          --results-directory ${{ github.workspace }}/TestResults

      - name: Run gateway integration tests
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/mcp-nginx-demo.config
        run: >
          INFRA_GATE_REQUIRE_GATEWAY_INTEGRATION=1 dotnet test tests/InfraGate.McpGateway.Tests/InfraGate.McpGateway.Tests.csproj
          --configuration Release --no-build --filter "Category!=Keycloak"
          --logger "trx;LogFileName=gateway-integration.trx"
          --results-directory ${{ github.workspace }}/TestResults

      # Bounded, credential-free diagnostics so a failure can be attributed to
      # acquisition (binary/cluster provisioning), RBAC (viewer permissions),
      # process (kubernetes-mcp-server subprocess), policy, or protocol
      # without anyone needing repro access to the ephemeral cluster.
      # Deliberately excludes .kube/*.config: those carry the viewer/admin
      # service account bearer tokens and must never leave the runner.
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          kubectl get all -n mcp-nginx-demo -o wide > ci-diagnostics/resources.txt 2>&1 || true
          kubectl describe pods -n mcp-nginx-demo > ci-diagnostics/describe-pods.txt 2>&1 || true
          kubectl get events -n mcp-nginx-demo --sort-by=.lastTimestamp > ci-diagnostics/events.txt 2>&1 || true
          kubectl get rolebindings,roles -n mcp-nginx-demo -o yaml > ci-diagnostics/rbac.yaml 2>&1 || true
          kubectl auth can-i --list --as=system:serviceaccount:mcp-nginx-demo:infra-gate-mcp-view -n mcp-nginx-demo > ci-diagnostics/viewer-can-i.txt 2>&1 || true
          minikube logs --file=ci-diagnostics/minikube.log || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: integration-test-diagnostics
          path: |
            ci-diagnostics/
            TestResults/
          retention-days: 7
