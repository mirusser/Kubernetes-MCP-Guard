name: Semgrep Security Scan

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: semgrep-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SEMGREP_BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Semgrep Scan
        id: semgrep
        env:
          SEMGREP_RULES: p/auto p/secrets p/owasp-top-ten
        run: |
          python3 -m pip install semgrep==1.165.0
          semgrep ci --config p/auto --config p/secrets --config p/owasp-top-ten

      - name: Upload SARIF to GitHub Security
        id: upload-sarif
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep-full
