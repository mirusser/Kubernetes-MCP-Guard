name: Safety E2E Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safety-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  safety-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5
        with:
          dotnet-version: 10.0.x

      - name: Create KinD cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863d1c  # v1.12.0
        with:
          wait: 120s
          kubectl_version: v1.32.0

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl wait --for=condition=Ready node --all --timeout=120s

      - name: Apply demo RBAC and Deployment
        run: |
          kubectl apply --validate=false -f deploy/minikube/rbac.yaml
          kubectl wait --for=condition=Ready pod -l app=nginx-demo -n mcp-nginx-demo --timeout=120s || true
          kubectl apply -f examples/failing-deployment/deployment.yaml

      - name: Create service-account kubeconfig
        run: ./scripts/create-demo-kubeconfig.sh

      - name: Restore and build
        run: |
          dotnet restore InfraGate.slnx
          dotnet build InfraGate.slnx --configuration Release --no-restore

      - name: Validate run profiles
        run: dotnet run --project src/InfraGate.RunProfiles -- validate

      - name: Run Safety E2E tests
        env:
          INFRA_GATE_RUN_SAFETY_E2E: "1"
          KUBECONFIG: ${{ github.workspace }}/.kube/mcp-nginx-demo.config
        run: |
          dotnet test tests/InfraGate.Safety.E2E.Tests/InfraGate.Safety.E2E.Tests.csproj \
            --configuration Release --no-build \
            --filter "Category=SafetyE2E"
