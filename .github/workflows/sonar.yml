name: SonarCloud Analysis

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Begin Sonar scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool run dotnet-sonarscanner begin \
            /k:"${{ vars.SONAR_PROJECT_KEY }}" \
            /o:"${{ vars.SONAR_ORGANIZATION }}" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.coverage.exclusions="**/Program.cs,**/PromptInjectionGuard.Regex.cs" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/coverage/**/coverage.opencover.xml"

      - name: Restore NuGet packages
        run: dotnet restore InfraGate.slnx

      - name: Build
        run: dotnet build InfraGate.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test InfraGate.slnx --configuration Release --no-build --filter "Category!=Keycloak" --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory TestResults/coverage -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Verify coverage report
        run: find TestResults/coverage -name coverage.opencover.xml | grep .

      - name: End Sonar scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet tool run dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Wait for SonarCloud CE task
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          AUTH="$SONAR_TOKEN:"
          BASE="https://sonarcloud.io/api"
          deadline=$((SECONDS + 120))
          while true; do
            status=$(curl -sf -u "$AUTH" \
              "$BASE/ce/component?component=$SONAR_PROJECT_KEY" | jq -r '.current.status // "MISSING"')
            case "$status" in
              SUCCESS) break;;
              FAILED|CANCELED) echo "::error::SonarCloud CE task $status" >&2; exit 1;;
              MISSING)  echo "::warning::CE task not found, proceeding" >&2; break;;
              *)        echo "CE task status: $status (waiting...)";;
            esac
            if [ $SECONDS -ge $deadline ]; then
              echo "::warning::CE task still $status after 120s, proceeding anyway" >&2
              break
            fi
            sleep 5
          done

      - name: Export SonarCloud report
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          AUTH="$SONAR_TOKEN:"
          BASE="https://sonarcloud.io/api"
          METRICS="bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,sqale_rating,reliability_rating,security_rating,security_review_rating,maintainability_rating,ncloc,complexity,cognitive_complexity"

          page=1
          all_issues='[]'
          while true; do
            resp=$(curl -sf -u "$AUTH" \
              "$BASE/issues/search?componentKeys=$SONAR_PROJECT_KEY&ps=500&p=$page&statuses=OPEN,CONFIRMED&additionalFields=rules") || {
              echo "::warning::SonarCloud issues fetch failed (page $page)" >&2
              break
            }
            chunk=$(echo "$resp" | jq '.issues // []')
            all_issues=$(jq -n --argjson a "$all_issues" --argjson b "$chunk" '$a + $b')
            total=$(echo "$resp" | jq '.paging.total // 0')
            [ $((page * 500)) -ge "$total" ] && break
            page=$((page + 1))
          done

          qg=$(curl -sf -u "$AUTH" \
            "$BASE/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY") || {
            echo "::warning::SonarCloud quality gate fetch failed" >&2; qg='{}'
          }

          measures=$(curl -sf -u "$AUTH" \
            "$BASE/measures/component?component=$SONAR_PROJECT_KEY&metricKeys=$METRICS") || {
            echo "::warning::SonarCloud measures fetch failed" >&2; measures='{}'
          }

          page=1
          all_hotspots='[]'
          while true; do
            resp=$(curl -sf -u "$AUTH" \
              "$BASE/hotspots/search?projectKey=$SONAR_PROJECT_KEY&ps=500&p=$page") || {
              echo "::warning::SonarCloud hotspots fetch failed (page $page)" >&2
              break
            }
            chunk=$(echo "$resp" | jq '.hotspots // []')
            all_hotspots=$(jq -n --argjson a "$all_hotspots" --argjson b "$chunk" '$a + $b')
            total=$(echo "$resp" | jq '.paging.total // 0')
            [ $((page * 500)) -ge "$total" ] && break
            page=$((page + 1))
          done

          jq -n \
            --arg project "$SONAR_PROJECT_KEY" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg branch "${GITHUB_REF_NAME}" \
            --argjson qualityGate "$qg" \
            --argjson measures "$measures" \
            --argjson issues "$all_issues" \
            --argjson hotspots "$all_hotspots" \
            '{
              metadata: {
                generatedAt: $generatedAt,
                projectKey: $project,
                sonarcloudUrl: ("https://sonarcloud.io/project/overview?id=" + $project),
                branch: $branch
              },
              qualityGate: $qualityGate,
              measures: $measures,
              issues: $issues,
              hotspots: $hotspots
            }' > sonarcloud-report.json

      - name: Upload SonarCloud report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: sonarcloud-report
          path: sonarcloud-report.json
          retention-days: 7
