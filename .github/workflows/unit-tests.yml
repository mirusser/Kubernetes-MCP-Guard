name: Unit Tests

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InfraGate.slnx

      - name: Build
        run: dotnet build InfraGate.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test InfraGate.slnx --configuration Release --no-build
