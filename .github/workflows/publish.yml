name: Docker

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
    tags:
      - v*
  workflow_dispatch:
    inputs:
      push_images:
        description: Push images to Docker Hub and GitHub Container Registry
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'local' }}
      PUSH_IMAGES: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.push_images) }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kubernetes-mcp-guard-gateway
            dockerfile: deploy/docker/mcp-gateway.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Validate Docker Hub configuration
        if: env.PUSH_IMAGES == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE_REQUIRED: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "vars.DOCKERHUB_USERNAME is required to push images."; exit 1; }
          test -n "$DOCKERHUB_NAMESPACE_REQUIRED" || { echo "vars.DOCKERHUB_NAMESPACE is required to push images."; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "secrets.DOCKERHUB_TOKEN is required to push images."; exit 1; }

      - name: Login to GitHub Container Registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6
        with:
          images: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Login to Docker Hub
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUSH_IMAGES == 'true' }}
          load: ${{ env.PUSH_IMAGES != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest artifact
        if: env.PUSH_IMAGES == 'true'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  deploy-development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, linux]
    needs:
      - docker
    environment: development
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_COMPOSE_FILE: deploy/compose/development.yaml
      DEPLOY_CONFIG_FILE: /etc/infra-gate/development.appsettings.json
      DEPLOY_ENV_FILE: /etc/infra-gate/development.env
      DEPLOY_IMAGE_TAG: dev
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/infra-gate' }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare deploy directory
        run: mkdir -p "$DEPLOY_PATH"

      - name: Copy compose file
        run: cp "$DEPLOY_COMPOSE_FILE" "$DEPLOY_PATH/compose.yaml"

      - name: Deploy development
        run: |
          cd "$DEPLOY_PATH"
          test -f "$DEPLOY_ENV_FILE" || { echo "Runtime env file not found: $DEPLOY_ENV_FILE" >&2; exit 1; }
          test -f "$DEPLOY_CONFIG_FILE" || { echo "Runtime appsettings file not found: $DEPLOY_CONFIG_FILE" >&2; exit 1; }

          INFRA_GATE_GATEWAY_ENV_FILE="$DEPLOY_ENV_FILE" TAG="$DEPLOY_IMAGE_TAG" docker compose --env-file "$DEPLOY_ENV_FILE" -f compose.yaml pull
          INFRA_GATE_GATEWAY_ENV_FILE="$DEPLOY_ENV_FILE" TAG="$DEPLOY_IMAGE_TAG" docker compose --env-file "$DEPLOY_ENV_FILE" -f compose.yaml up -d --remove-orphans

          bind_port="$(sed -n 's/^INFRA_GATE_BIND_PORT=//p' "$DEPLOY_ENV_FILE" | tail -n 1)"
          bind_port="${bind_port:-3001}"
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT

          elapsed=0
          while true; do
            : > "$headers"
            : > "$body"
            http_status="$(curl -sS -D "$headers" -o "$body" -w "%{http_code}" \
              -X POST "http://127.0.0.1:${bind_port}/mcp" \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","method":"initialize","id":1,"params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"deploy-check","version":"0"}}}' \
              2>/dev/null || true)"

            if [ "$http_status" = "401" ] && grep -qi '^www-authenticate:.*resource_metadata' "$headers"; then
              break
            fi

            if [ "$elapsed" -ge 60 ]; then
              echo "Gateway did not return the expected OAuth 401 challenge." >&2
              echo "Last HTTP status: ${http_status:-none}" >&2
              INFRA_GATE_GATEWAY_ENV_FILE="$DEPLOY_ENV_FILE" docker compose --env-file "$DEPLOY_ENV_FILE" -f compose.yaml logs --tail=50 >&2 || true
              exit 1
            fi

            sleep 2
            elapsed=$((elapsed + 2))
          done
